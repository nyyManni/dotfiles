[Unit]
# Ensure the graphical session (and its environment, including
# HYPRLAND_INSTANCE_SIGNATURE pushed in by uwsm) is up before emacs starts.
# `Wants=` pulls the target into the transaction and `After=` orders us
# after it. `Requisite=` would fail immediately at login because emacs is
# pulled in by default.target, which is reached before the compositor
# brings graphical-session.target up.
Wants=graphical-session.target
After=graphical-session.target
PartOf=graphical-session.target

[Install]
WantedBy=graphical-session.target
