# System greeter configuration: install as /var/lib/noctalia-greeter/greeter.toml.
# Requires Noctalia Greeter with stable output identifiers (tested with 1.7.0).
# Sync/UI state stays in sync.toml; appearance sync remains enabled.

[session]
default = "Hyprland (uwsm-managed)"

# For the internal keyboard, replace the Ergodox settings below with:
# [keyboard]
# layout = "uf,fi"
# options = "grp:alt_space_toggle,ctrl:swap_lalt_lctl,ctrl:swap_ralt_rctl,caps:escape"

# For Ergodox (preserved from the installed configuration).
[keyboard]
layout = "us,fi"
options = "grp:ctrls_toggle"

[output]
# Do not use connector-keyed display settings captured by shell appearance sync.
use_synced_settings = false

# Stable descriptions/serials from Hyprland's monitor rules, without desc:.
# Absent monitors are ignored. Only the known external pairs have fixed positions.
# The laptop, TVs, and unfamiliar outputs are automatically placed to their right.
# No output.name pin: show the login UI on every available output.
layout = """
Dell Inc. DELL U2719D 9JWNY13:0,0;
Dell Inc. DELL U2719D 1JWNY13:2560,-750;
Lenovo Group Limited L27qe UTP02HZK:0,0;
